# XcodeGen 프로젝트 정의 — `brew install xcodegen && xcodegen generate` 후 Loadcast.xcodeproj 오픈
name: Loadcast
options:
  bundleIdPrefix: com.loadcast
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"

packages:
  LoadcastCore:
    path: LoadcastCore

configs:
  Debug: debug
  Release: release

# 커밋되는 Config.xcconfig가 (있으면) Secrets.xcconfig를 include — 키 없이도 빌드 성공.
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig

targets:
  Loadcast:
    type: application
    platform: iOS
    sources:
      - Loadcast
    dependencies:
      - package: LoadcastCore
    settings:
      base:
        # 직접 관리하는 Info.plist 사용(키 주입 위해). XcodeGen이 이 파일은 리소스에서 제외.
        INFOPLIST_FILE: Loadcast/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.loadcast.app
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 5.9
